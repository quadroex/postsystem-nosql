name: postsystem-nosql

services:
  postgres:
    image: postgres:18.2
    environment:
      POSTGRES_DB: postsystem_nosql
      POSTGRES_USER: postal
      POSTGRES_PASSWORD: postal_lab
    command: [postgres, -c, shared_buffers=512MB, -c, effective_cache_size=1536MB]
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    cpus: 4.0
    mem_limit: 2g
    healthcheck:
      test: [CMD, pg_isready, -h, '127.0.0.1', -U, postal, -d, postsystem_nosql]
      interval: 3s
      timeout: 3s
      retries: 20
  mongo:
    image: mongo:8.0.26
    environment:
      MONGO_INITDB_ROOT_USERNAME: postal
      MONGO_INITDB_ROOT_PASSWORD: postal_lab
    command: [mongod, --bind_ip_all, --wiredTigerCacheSizeGB, '0.5']
    ports:
      - '127.0.0.1:57017:27017'
    volumes:
      - mongodata:/data/db
    cpus: 4.0
    mem_limit: 2g
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'if (db.adminCommand({ping:1}).ok !== 1) quit(1)']
      interval: 3s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.2
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  mongodata:
